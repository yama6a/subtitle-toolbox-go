linters:
  settings:
    wrapcheck:
      # The internal helpers return the *model.ParseError of a read, which the format packages pass on unchanged.
      # The root package passes the errors of the format packages on unchanged too.
      # The CLI passes the errors of the root package and of the Subtitle methods on unchanged, because its messages
      # read their types.
      # A service passes the retiming errors of the model on unchanged.
      # The root package passes the errors of the container packages on unchanged too.
      # The CLI passes the errors of refsync on unchanged, because its messages read their types.
      # The CLI passes the errors of dual on unchanged, because its messages read their types.
      # The CLI passes the errors of profanity on unchanged, because its messages read their types.
      # The CLI passes the errors of diff, fixing and hearingimpaired on unchanged, because its messages read their types.
      # The CLI passes the errors of hls on unchanged, because its messages read their types.
      # The CLI passes the *InvalidArgumentError of timing and validation on unchanged, because its messages print it.
      # The translation runner passes the errors of the engines on unchanged, because the CLI messages read their types.
      # The OCR packages pass the errors of the engines on unchanged, because the CLI messages read their types.
      ignore-package-globs:
        - github.com/yama6a/subtitle-toolbox-go/v4/internal/*
        - github.com/yama6a/subtitle-toolbox-go/v4/container/*
        - github.com/yama6a/subtitle-toolbox-go/v4/format/*
        - github.com/yama6a/subtitle-toolbox-go/v4
        - github.com/yama6a/subtitle-toolbox-go/v4/model
        - github.com/yama6a/subtitle-toolbox-go/v4/refsync
        - github.com/yama6a/subtitle-toolbox-go/v4/dual
        - github.com/yama6a/subtitle-toolbox-go/v4/profanity
        - github.com/yama6a/subtitle-toolbox-go/v4/diff
        - github.com/yama6a/subtitle-toolbox-go/v4/fixing
        - github.com/yama6a/subtitle-toolbox-go/v4/hearingimpaired
        - github.com/yama6a/subtitle-toolbox-go/v4/timing
        - github.com/yama6a/subtitle-toolbox-go/v4/hls
        - github.com/yama6a/subtitle-toolbox-go/v4/validation
        - github.com/yama6a/subtitle-toolbox-go/v4/ocr
        - github.com/yama6a/subtitle-toolbox-go/v4/ocr/*
        - github.com/yama6a/subtitle-toolbox-go/v4/translation
        - github.com/yama6a/subtitle-toolbox-go/v4/translation/*
  exclusions:
    rules:
      # Test helpers and test doubles pass errors on unchanged, such as io.EOF and the fs.PathError that names a file.
      - path: _test\.go
        linters:
          - wrapcheck
