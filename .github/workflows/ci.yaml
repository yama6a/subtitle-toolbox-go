name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]  # go-ci saves its caches only from non-PR runs

concurrency:
  # A push run on main gets its own group, so a newer push never cancels a pending run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a push run on main always finishes

permissions:
  contents: read

jobs:
  go:
    uses: yama6a/gha/.github/workflows/go-ci.yaml@v2

  cross-compile:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - run: make cross

  fuzz-shard:
    name: fuzz shard ${{ matrix.shard }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - run: make fuzz FUZZTIME=10s FUZZSHARD="$SHARD" FUZZSHARDS="$SHARDS"
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
      # go test -fuzz writes each failing input to <package>/testdata/fuzz/<FuzzName>/.
      - name: Collect the new fuzz inputs
        if: failure()
        env:
          DEST: ${{ runner.temp }}/fuzz-findings
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          git ls-files -z --others --exclude-standard \
            | { grep -z -E '(^|/)testdata/fuzz/' || true; } \
            | xargs -0 -r cp --parents -t "$DEST"
          find "$DEST" -type f
      - name: Upload the new fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.shard }}
          path: ${{ runner.temp }}/fuzz-findings

  # The required check is named fuzz, and a matrix reports one check per shard.
  fuzz:
    needs: fuzz-shard
    if: ${{ always() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Fail unless every shard passed
        env:
          RESULT: ${{ needs.fuzz-shard.result }}
        run: |
          echo "fuzz shards: $RESULT"
          [ "$RESULT" = success ]

  bench:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - run: make bench BENCHTIME=1x
      # The growth tests time their own runs, so nothing else may run beside them.
      - name: Growth tests
        env:
          STBOX_GROWTH: '1'
        run: go test -run Growth -p 1 -parallel 1 -count=1 ./...

  smoke:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - run: make dist VERSION=0.0.0-ci
      - run: make smoke VERSION=0.0.0-ci

  tesseract:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus
      - run: go test -run Tesseract ./...
        env:
          STBOX_REQUIRE_TESSERACT: '1'

  docker:
    uses: yama6a/gha/.github/workflows/docker-build-check.yaml@v2
    with:
      dockerfile: .build/Dockerfile
      build-args: VERSION=0.0.0-ci
      smoke-test: .build/smoke-test.sh 0.0.0-ci files docker run --rm -v "$PWD/testdata:/work/files:ro" "$IMAGE"

  docker-tesseract:
    uses: yama6a/gha/.github/workflows/docker-build-check.yaml@v2
    with:
      dockerfile: .build/tesseract.Dockerfile
      build-args: VERSION=0.0.0-ci
      smoke-test: SMOKE_TESSERACT=1 .build/smoke-test.sh 0.0.0-ci files docker run --rm -v "$PWD/testdata:/work/files:ro" "$IMAGE"

  shell:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/shell-checks@v2
        with:
          paths: .build/*.sh

  yaml:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2

  renovate-config:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A broken config makes Renovate fall back to its defaults without a warning.
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
        with:
          config-file: renovate.json5
