# Releases on every merge to main: the archives and the image first, then the tag and the
# GitHub release with the archives attached, so a tag always has every artifact.
name: release

on:
  push:
    branches: [main]

# Serialised so two runs cannot tag the same version. A cancelled run here loses nothing:
# the next one recomputes the bump from every PR merged since the last release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    uses: yama6a/gha/.github/workflows/php-release.yaml@v2
    permissions:
      contents: write # the reusable job requests it, although create-release false only reads
    with:
      tag-prefix: v
      create-release: false

  archives:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - name: Build the archives and the checksum file
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make dist VERSION="$VERSION"
      # The runner is linux/arm64, so that archive is the one it can run.
      - name: Smoke-test the linux/arm64 binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make smoke VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    needs: [version, archives]
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    permissions:
      contents: write # requested by the reusable job, which creates no release here
      packages: write # or the image push fails with permission_denied
      id-token: write # mints the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    with:
      dockerfile: .build/Dockerfile
      version: ${{ needs.version.outputs.version }}
      build-args: |
        VERSION=${{ needs.version.outputs.version }}
      moving-tags: true
      create-release: false

  release:
    needs: [version, archives, image]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # mints the OIDC token the archive attestation is signed with
      attestations: write # stores the archive attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Tag and release with the archives
        uses: yama6a/gha/.github/actions/gh-release@v2
        with:
          tag: ${{ needs.version.outputs.tag }}
          target: ${{ github.sha }}
          generate-notes: "true"
          notes: "Image: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}`"
          files: |
            dist/stbox_${{ needs.version.outputs.version }}_linux_amd64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_linux_arm64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_darwin_amd64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_darwin_arm64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_windows_amd64.zip
            dist/stbox_${{ needs.version.outputs.version }}_windows_arm64.zip
            dist/stbox_${{ needs.version.outputs.version }}_checksums.txt
