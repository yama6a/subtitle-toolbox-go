# Releases on every merge to main: the archives and the image first, then the tag and the
# GitHub release with the archives and the deb and rpm packages attached, so a tag always has every artifact.
name: release

on:
  push:
    branches: [main]

# Serialised so two runs cannot tag the same version. A cancelled run here loses nothing:
# the next one recomputes the bump from every PR merged since the last release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    uses: yama6a/gha/.github/workflows/php-release.yaml@v2
    permissions:
      contents: write # the reusable job requests it, although create-release false only reads
    with:
      tag-prefix: v
      create-release: false

  archives:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # one shared key would hand darwin, windows or fuzz builds to the other jobs
      - name: Build the archives and the checksum file
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make dist VERSION="$VERSION"
      # nfpm is a build tool, so it stays out of go.mod. The job installs the release binary and checks its sum.
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=goreleaser/nfpm
          NFPM_VERSION: v2.49.0
        run: |
          gh api -H 'Accept: application/vnd.github.raw' 'repos/yama6a/gha/contents/scripts/retry.sh?ref=v2' > "$RUNNER_TEMP/retry.sh"
          source "$RUNNER_TEMP/retry.sh"
          mkdir "$RUNNER_TEMP/nfpm"
          retry_release_download goreleaser/nfpm "$NFPM_VERSION" "$RUNNER_TEMP/nfpm" "nfpm_${NFPM_VERSION#v}_Linux_arm64.tar.gz" checksums.txt
          cd "$RUNNER_TEMP/nfpm"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "nfpm_${NFPM_VERSION#v}_Linux_arm64.tar.gz" nfpm
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build the deb and rpm packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: .build/linux-packages.sh "$VERSION" dist
      # The runner is linux/arm64, so that archive is the one it can run.
      - name: Smoke-test the linux/arm64 binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make smoke VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    needs: [version, archives]
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    permissions:
      contents: write # requested by the reusable job, which creates no release here
      packages: write # or the image push fails with permission_denied
      id-token: write # mints the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    with:
      dockerfile: .build/Dockerfile
      version: ${{ needs.version.outputs.version }}
      build-args: |
        VERSION=${{ needs.version.outputs.version }}
      moving-tags: true
      create-release: false

  image-tesseract:
    needs: [version, archives]
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    permissions:
      contents: write # requested by the reusable job, which creates no release here
      packages: write # or the image push fails with permission_denied
      id-token: write # mints the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    with:
      dockerfile: .build/tesseract.Dockerfile
      version: ${{ needs.version.outputs.version }}
      build-args: |
        VERSION=${{ needs.version.outputs.version }}
      moving-tags: true
      tag-suffix: -tesseract
      create-release: false

  release:
    needs: [version, archives, image, image-tesseract]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # mints the OIDC token the archive attestation is signed with
      attestations: write # stores the archive attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Tag and release with the archives
        uses: yama6a/gha/.github/actions/gh-release@v2
        with:
          tag: ${{ needs.version.outputs.tag }}
          target: ${{ github.sha }}
          generate-notes: "true"
          notes: "Images: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}`, with Tesseract `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}-tesseract`"
          files: |
            dist/stbox_${{ needs.version.outputs.version }}_linux_amd64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_linux_arm64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_darwin_amd64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_darwin_arm64.tar.gz
            dist/stbox_${{ needs.version.outputs.version }}_windows_amd64.zip
            dist/stbox_${{ needs.version.outputs.version }}_windows_arm64.zip
            dist/stbox_amd64.deb
            dist/stbox_arm64.deb
            dist/stbox.x86_64.rpm
            dist/stbox.aarch64.rpm
            dist/stbox_${{ needs.version.outputs.version }}_checksums.txt

  # Pushes the Homebrew formula of the new release to the branch bottle/stbox-<version> of yama6a/homebrew-tap.
  # The bottle workflow of the tap builds the bottles, adds the bottle block and commits the formula to main.
  # The secret HOMEBREW_TAP_TOKEN is a fine-grained token with contents write on that one repository,
  # because the job token cannot push to another repository.
  homebrew:
    needs: [version, release]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Write the formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: .build/homebrew-formula.sh "$VERSION" "dist/stbox_${VERSION}_checksums.txt" > stbox.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yama6a/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true # the next step pushes with git
      - name: Push the formula to the bottle branch of the tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp stbox.rb tap/Formula/stbox.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "bottle/stbox-$VERSION"
          git add Formula/stbox.rb
          git commit -m "Update stbox to $VERSION"
          git push --force origin "bottle/stbox-$VERSION"

  # The next 2 jobs install the package from the latest/download URL of the README, so they check the URL too.
  deb:
    needs: [version, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install the deb package
        run: |
          curl -fsSLo /tmp/stbox.deb "https://github.com/yama6a/subtitle-toolbox-go/releases/latest/download/stbox_$(dpkg --print-architecture).deb"
          sudo apt-get update
          sudo apt install -y /tmp/stbox.deb
      - name: Check the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: test "$(stbox --version)" = "$VERSION"

  rpm:
    needs: [version, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install the rpm package in a Fedora container
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -e VERSION fedora:latest@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c bash -euc '
            dnf install -y "https://github.com/yama6a/subtitle-toolbox-go/releases/latest/download/stbox.$(uname -m).rpm"
            test "$(stbox --version)" = "$VERSION"'
